[project]
name = "project-name"  # TODO
version = "0.1.0"
description = "A short description of your package."
authors = [{ name = "Your Name", email = "your.email@example.com" }]  # TODO
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
test = ["pytest"]
dev = [
    "mypy",
    "pylint",
    "ruff",
    "yamllint",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-unused-arguments
    "ARG",
    # Pylint
    "PL",
    # Perflint
    "PERF",
    # Ruff-specific rules
    "RUF",
    # pandas-vet
    "PD",
    # flynt
    "FLY",
    # flake8-boolean-trap
    "FBT",
    # flake8-use-pathlib
    "PTH",
    # flake8-comprehensions
    "C4",
    # flake8-bandit
    "S",
    # flake8-raise
    "RSE",
    # flake8-datetimez
    "DTZ",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
line-ending = "lf"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
no-docstring-rgx = "^__|^test_"

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX"]
